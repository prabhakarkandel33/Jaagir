name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.23"
          enable-cache: true

      - name: Sync workspace
        working-directory: backend
        run: uv sync --all-packages --locked

      - name: Lint and format check
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        working-directory: backend
        run: |
          uv run mypy packages/contracts/src
          uv run mypy services/job-service
          uv run mypy services/candidate-service

      - name: Start infrastructure
        run: docker compose -f deploy/docker-compose.dev.yml up -d --wait

      - name: Tests (contracts, job-service, candidate-service)
        run: |
          (cd backend/packages/contracts && uv run pytest -q)
          (cd backend/services/job-service && uv run pytest -q)
          (cd backend/services/candidate-service && uv run pytest -q)

      - name: Stop infrastructure
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
