# Local development infrastructure for the Job Portal.
# Two independent Postgres databases (one per service) + a single-node Kafka.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Only infrastructure lives here. The Django services run on the host via
# `make dev` / `tasks.ps1 dev` so they can use watch mode.
name: jobportal-dev

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: jobportal-kafka
    ports:
      # EXTERNAL listener for host processes (make dev).
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker: replication factor 1 everywhere, or producers hang.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka_data:/var/lib/kafka/data

  job-db:
    image: postgres:16
    container_name: jobportal-job-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: jobportal
      POSTGRES_PASSWORD: jobportal
      POSTGRES_DB: job_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobportal -d job_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - job_db_data:/var/lib/postgresql/data

  candidate-db:
    image: postgres:16
    container_name: jobportal-candidate-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: jobportal
      POSTGRES_PASSWORD: jobportal
      POSTGRES_DB: candidate_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobportal -d candidate_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - candidate_db_data:/var/lib/postgresql/data

volumes:
  kafka_data:
  job_db_data:
  candidate_db_data:
