[project]
name = "job-service"
version = "0.1.0"
description = "Job Service: recruiters, jobs, outbox. Owns job_db."
requires-python = ">=3.12,<3.13"
dependencies = [
  "contracts",
  "django>=5.2,<6",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "django-cors-headers>=4.4",
  "djangorestframework-simplejwt>=5.3",
  # ES256/RS256 signing in SimpleJWT needs PyJWT's crypto backend.
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "confluent-kafka>=2.5",
  "gunicorn>=23",
]

# A Django project is run in place, not installed. Keeping it a non-package
# member avoids a top-level `config`/`apps` name clash with the other service
# in the shared workspace virtualenv.
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
